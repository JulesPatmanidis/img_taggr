<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>img-taggr</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <link rel="stylesheet" href="vendor/markercluster.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="bar">
      <div class="brand"><span class="dot"></span>img-taggr</div>
      <button id="btnOpen" class="btn">Open folder</button>
      <div id="folderLabel" class="folder muted"></div>
      <div class="spacer"></div>
      <button id="btnUndo" class="btn" disabled title="Undo — Ctrl+Z">Undo</button>
      <button id="btnRedo" class="btn" disabled title="Redo — Ctrl+Shift+Z">Redo</button>
      <button id="btnSave" class="btn primary" disabled>Save</button>
    </header>

    <main>
      <aside class="strip">
        <div class="stripHead">
          <span id="stripCount" class="muted">No photos</span>
          <button id="btnSelectAll" class="link">Select all</button>
        </div>
        <div id="stripFilters" class="filters" role="radiogroup" aria-label="Show photos">
          <button class="filter on" data-filter="all" role="radio" aria-checked="true" disabled>All <b></b></button>
          <button class="filter" data-filter="undated" role="radio" aria-checked="false" disabled>No date <b></b></button>
          <button class="filter" data-filter="unplaced" role="radio" aria-checked="false" disabled>No location <b></b></button>
        </div>
        <div id="seedRow" class="seedRow hidden">
          <button id="btnSeedDates" class="link" title="Set capture time from each file's modification date">Date undated photos from their files</button>
        </div>
        <div id="stripList" class="stripList"></div>
        <div id="stripEmpty" class="stripEmpty muted hidden">Nothing left here.</div>
      </aside>
      <div id="stripResize" class="resizer" title="Drag to resize"></div>

      <section id="stage">
        <!-- ── Map view ─────────────────────────────────────────── -->
        <div id="mapView" class="pane">
          <div id="map"></div>
          <div class="overlay tr">
            <button class="maxBtn" data-pane="map" type="button" aria-pressed="false"
              aria-label="Enlarge map" title="Enlarge map — M">
              <svg class="grow" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="shrink" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.5 6.5h-4v-4M2.5 9.5h4v4M9.5 6.5 14 2M6.5 9.5 2 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="overlay tl">
            <div class="hint">Click the map to place the selected photos.</div>
          </div>
          <div class="overlay bl tools">
            <div class="seg" id="basemapSeg" role="radiogroup" aria-label="Map style">
              <button data-basemap="map" role="radio" aria-checked="true">Map</button>
              <button data-basemap="satellite" role="radio" aria-checked="false">Satellite</button>
            </div>
            <button id="btnInterp" class="btn sm" disabled
              title="Position un-placed photos along the route between the placed ones, by time">
              Interpolate route
            </button>
            <label class="chk"><input type="checkbox" id="chkPath" checked /> Route</label>
          </div>
        </div>

        <div id="splitResize" class="resizer h" role="separator" aria-orientation="horizontal"
          aria-label="Resize map and timeline" title="Drag to resize"></div>

        <!-- ── Timeline view ────────────────────────────────────── -->
        <div id="timeView" class="pane">
          <div class="overlay tr">
            <button class="maxBtn" data-pane="time" type="button" aria-pressed="false"
              aria-label="Enlarge timeline" title="Enlarge timeline — T">
              <svg class="grow" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="shrink" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.5 6.5h-4v-4M2.5 9.5h4v4M9.5 6.5 14 2M6.5 9.5 2 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="overlay br">
            <div class="hint" id="timeHint"></div>
          </div>
          <div id="tl" class="tl">
            <div id="tlAxis" class="tlAxis" title="Drag to pan"></div>
            <div id="tlTrack" class="tlTrack"></div>
          </div>
          <div class="overlay bl tools">
            <button id="btnFit" class="btn sm" title="Show every dated photo">Fit all</button>
          </div>
        </div>
      </section>

      <!-- ── Inspector ──────────────────────────────────────────── -->
      <aside id="inspector" class="inspector" aria-label="Inspector">
        <button id="btnIns" class="insToggle" type="button" aria-expanded="true"
          aria-controls="insBody" aria-label="Hide inspector" title="Hide inspector">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div id="insBody" class="insBody">
          <div class="insHead">
            <div id="insThumb" class="insThumb"></div>
            <div class="insName">
              <span id="selLabel" class="selLabel">Nothing selected</span>
              <span id="editLabel" class="pill hidden"></span>
            </div>
          </div>
          <div class="insShow">
            <button id="btnShowMap" class="btn sm" disabled title="Double-click a photo to do the same">Show on map</button>
            <button id="btnShowTime" class="btn sm" disabled title="Double-click a photo to do the same">Show on timeline</button>
          </div>

          <section class="insSec">
            <h3>Time</h3>
            <div class="fld">
              <label for="fDt">Date &amp; time</label>
              <div class="dt">
                <input id="fDt" type="text" inputmode="numeric" disabled />
                <button id="btnCal" class="calBtn" type="button" aria-label="Open calendar" disabled>
                  <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M2 6.5h12M5 1.5v3M11 1.5v3" stroke="currentColor" stroke-width="1.3"/></svg>
                </button>
              </div>
            </div>
            <label class="fld"><span>UTC offset</span><input id="fTz" type="text" placeholder="+02:00" disabled /></label>
            <label class="fld"><span>Shift by</span><input id="fShift" type="text" placeholder="+3h47m" disabled aria-describedby="shiftHelp" /></label>
            <p id="shiftHelp" class="help">Moves every selected photo, keeping the gaps between them. Press Enter to apply.</p>
          </section>

          <section class="insSec">
            <h3>Location</h3>
            <label class="fld"><span>Latitude</span><input id="fLat" type="text" placeholder="—" disabled /></label>
            <label class="fld"><span>Longitude</span><input id="fLon" type="text" placeholder="—" disabled /></label>
            <button id="btnClearGps" class="btn sm" disabled>Clear location</button>
          </section>

          <div class="insFoot">
            <button id="btnRevert" class="btn sm" disabled>Revert changes</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- ── Save sheet ─────────────────────────────────────────────── -->
  <div id="modal" class="modalWrap hidden">
    <div class="modal">
      <h2>Save changes</h2>
      <p class="muted" id="modalSummary"></p>
      <div class="radios" id="modeRadios">
        <label class="radio">
          <input type="radio" name="mode" value="copy" checked />
          <div>
            <b>Write copies</b>
            <span class="muted">Originals untouched; tagged files go to a new folder.</span>
          </div>
        </label>
        <label class="radio">
          <input type="radio" name="mode" value="backup" />
          <div>
            <b>Edit in place, keep backups</b>
            <span class="muted">Each original is preserved as <code>name.ext_original</code>.</span>
          </div>
        </label>
        <label class="radio">
          <input type="radio" name="mode" value="inplace" />
          <div>
            <b>Edit in place</b>
            <span class="muted">Overwrites originals. No undo once written.</span>
          </div>
        </label>
      </div>
      <label class="fld wide" id="outRow">
        <span>Output folder</span>
        <div class="row">
          <input id="fOut" type="text" />
          <button id="btnPickOut" class="btn sm">Browse</button>
        </div>
      </label>
      <div class="modalBtns">
        <button id="btnCancel" class="btn">Cancel</button>
        <button id="btnConfirm" class="btn primary">Write files</button>
      </div>
    </div>
  </div>

  <div id="dropZone" class="dropZone hidden"><div>Drop a folder to open it</div></div>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/leaflet.markercluster.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
