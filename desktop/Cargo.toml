[workspace]

[package]
name = "img-taggr"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "img_taggr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
img-taggr-core = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
base64 = "0.22"
rayon = "1"
walkdir = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
